name: Verify web build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_APPLICATION_ID: success-ovi7jfw
          VITE_RUNABLE_AUTH_ISSUER: https://api.runable.com/api/auth
